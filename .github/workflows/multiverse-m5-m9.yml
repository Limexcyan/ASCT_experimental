name: ASCT M5-M9 source tests

on:
  push:
    branches:
      - 'feature/m5-*'
      - 'feature/m6-*'
      - 'feature/m9-*'
      - 'feature/m10-*'
  pull_request:
    paths:
      - '.github/workflows/multiverse-m5-m9.yml'
      - 'multiverse/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab-unit:
    name: MATLAB R2024b unit tests (M5-M10)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set up MATLAB R2024b
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
      - name: Run isolated source tests (no real EEG, FieldTrip, or multar)
        uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath(pwd);
            addpath(fullfile(pwd,'multiverse'));
            results=runtests({'tests/TestMultiverseM5.m','tests/TestMultiverseM6.m','tests/TestMultiverseM7.m','tests/TestMultiverseM8.m','tests/TestMultiverseM9.m','tests/TestMultiverseM10.m'});
            disp(results);
            assert(~isempty(results) && all([results.Passed]),'ASCT:M9:CI','MATLAB source tests failed');
